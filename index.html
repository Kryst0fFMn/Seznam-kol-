<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Seznam úkolů</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --text: #1f2937;
      --muted: #6b7280;
      --done: #16a34a;
      --danger: #dc2626;
      --border: #e5e7eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef4ff, #f8fafc);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 40px 20px;
    }

    .app {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(16, 24, 40, 0.08);
      padding: 24px;
    }

    h1 {
      margin: 0 0 20px;
      font-size: 2rem;
      text-align: center;
    }

    .input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 14px 16px;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .add-btn {
      background: var(--primary);
      color: white;
      font-weight: 600;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    .stats {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      margin-bottom: 16px;
      font-size: 0.95rem;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #f9fafb;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 0;
    }

    .task-text {
      flex: 1;
      word-break: break-word;
      transition: 0.2s ease;
    }

    .task-text.done {
      text-decoration: line-through;
      color: var(--muted);
    }

    .checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--done);
      cursor: pointer;
    }

    .delete-btn {
      background: #fee2e2;
      color: var(--danger);
      padding: 8px 10px;
      font-size: 0.9rem;
    }

    .delete-btn:hover {
      background: #fecaca;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
      padding: 18px;
      background: #fafafa;
    }
  </style>
</head>
<body>
  <div class="app">
    <h1>Seznam úkolů</h1>

    <div class="input-row">
      <input id="taskInput" type="text" placeholder="Napiš úkol..." maxlength="200" />
      <button class="add-btn" id="addTaskBtn">Přidat</button>
    </div>

    <div class="stats">
      <span id="taskCount">0 úkolů</span>
      <span id="remainingCount">0 zbývá</span>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const addTaskBtn = document.getElementById("addTaskBtn");
    const taskList = document.getElementById("taskList");
    const taskCount = document.getElementById("taskCount");
    const remainingCount = document.getElementById("remainingCount");

    let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

    function saveTasks() {
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function updateStats() {
      const remaining = tasks.filter(task => !task.done).length;

      taskCount.textContent = `${tasks.length} úkol${tasks.length === 1 ? "" : "ů"}`;
      remainingCount.textContent = `${remaining} zbývá`;
    }

    function renderTasks() {
      taskList.innerHTML = "";

      if (tasks.length === 0) {
        const empty = document.createElement("li");
        empty.className = "empty";
        empty.textContent = "Žádné úkoly. Přidej první!";
        taskList.appendChild(empty);
        updateStats();
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement("li");

        const main = document.createElement("div");
        main.className = "task-main";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = task.done;
        checkbox.className = "checkbox";
        checkbox.addEventListener("change", () => {
          tasks[index].done = checkbox.checked;
          saveTasks();
          renderTasks();
        });

        const text = document.createElement("span");
        text.className = "task-text";
        if (task.done) text.classList.add("done");
        text.textContent = task.text;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "delete-btn";
        deleteBtn.textContent = "Smazat";
        deleteBtn.addEventListener("click", () => {
          tasks.splice(index, 1);
          saveTasks();
          renderTasks();
        });

        main.appendChild(checkbox);
        main.appendChild(text);

        li.appendChild(main);
        li.appendChild(deleteBtn);

        taskList.appendChild(li);
      });

      updateStats();
    }

    function addTask() {
      const text = taskInput.value.trim();

      if (!text) {
        taskInput.focus();
        return;
      }

      tasks.unshift({
        text,
        done: false
      });

      saveTasks();
      taskInput.value = "";
      taskInput.focus();
      renderTasks();
    }

    addTaskBtn.addEventListener("click", addTask);

    taskInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        addTask();
      }
    });

    renderTasks();
  </script>
</body>
</html>
